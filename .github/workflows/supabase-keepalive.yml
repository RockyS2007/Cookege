name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days without activity.
# This pings the REST API every 3 days so the live site stays up.
on:
  schedule:
    - cron: "0 12 */3 * *" # 12:00 UTC every 3rd day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query one row from recipes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY repository secrets must be set"
            exit 1
          fi
          url="${SUPABASE_URL%/}/rest/v1/recipes?select=id&limit=1"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$url"
          echo
          echo "Supabase responded OK"
